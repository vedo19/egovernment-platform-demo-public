services:
  # ───────────────────────────── Auth Database ─────────────────────────────
  auth_db:
    image: postgres:16-alpine
    container_name: auth_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-CHANGE_ME_POSTGRES_PASSWORD}"
      POSTGRES_DB: auth_db
    ports:
      - "5436:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ───────────────────────────── Auth Service ──────────────────────────────
  auth_service:
    build:
      context: .
      dockerfile: src/AuthService/Dockerfile
    container_name: auth_service
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=auth_db;Port=5432;Database=auth_db;Username=postgres;Password=${POSTGRES_PASSWORD:-CHANGE_ME_POSTGRES_PASSWORD}"
      AuthDb__Host: "${AuthDb__Host:-auth_db}"
      AuthDb__Port: "${AuthDb__Port:-5432}"
      AuthDb__Database: "${AuthDb__Database:-auth_db}"
      AuthDb__Username: "${AuthDb__Username:-postgres}"
      AuthDb__Password: "${AuthDb__Password:-CHANGE_ME_POSTGRES_PASSWORD}"
      AuthDb__SslMode: "${AuthDb__SslMode:-Disable}"
      AuthDb__ChannelBinding: "${AuthDb__ChannelBinding:-}"
      Jwt__Key: "${JWT_SECRET_KEY:-CHANGE_ME_GENERATE_A_RANDOM_SECRET_MINIMUM_32_CHARS}"
      Jwt__Issuer: "AuthService"
      Jwt__Audience: "EGovernmentPlatform"
      Jwt__ExpiryMinutes: "60"
      Internal__ApiKey: "${INTERNAL_API_KEY:-CHANGE_ME_INTERNAL_KEY}"
      Admin__Email: "${ADMIN_EMAIL:-change-me-admin@example.com}"
      Admin__Password: "${ADMIN_PASSWORD:-CHANGE_ME_STRONG_ADMIN_PASSWORD}"
      Admin__FullName: "${ADMIN_FULLNAME:-System Administrator}"
    depends_on:
      auth_db:
        condition: service_healthy

  # ──────────────────────────── Citizen Database ───────────────────────────
  citizen_db:
    image: postgres:16-alpine
    container_name: citizen_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-CHANGE_ME_POSTGRES_PASSWORD}"
      POSTGRES_DB: citizen_db
    ports:
      - "5433:5432"
    volumes:
      - citizen_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ──────────────────────────── Citizen Service ────────────────────────────
  citizen_service:
    build:
      context: .
      dockerfile: src/CitizenService/Dockerfile
    container_name: citizen_service
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=citizen_db;Port=5432;Database=citizen_db;Username=postgres;Password=${POSTGRES_PASSWORD:-CHANGE_ME_POSTGRES_PASSWORD}"
      CitizenDb__Host: "${CitizenDb__Host:-citizen_db}"
      CitizenDb__Port: "${CitizenDb__Port:-5432}"
      CitizenDb__Database: "${CitizenDb__Database:-citizen_db}"
      CitizenDb__Username: "${CitizenDb__Username:-postgres}"
      CitizenDb__Password: "${CitizenDb__Password:-CHANGE_ME_POSTGRES_PASSWORD}"
      CitizenDb__SslMode: "${CitizenDb__SslMode:-Disable}"
      Jwt__Key: "${JWT_SECRET_KEY:-CHANGE_ME_GENERATE_A_RANDOM_SECRET_MINIMUM_32_CHARS}"
      Jwt__Issuer: "AuthService"
      Jwt__Audience: "EGovernmentPlatform"
    depends_on:
      citizen_db:
        condition: service_healthy

  # ─────────────────────── Service Request Database ────────────────────────
  request_db:
    image: postgres:16-alpine
    container_name: request_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-CHANGE_ME_POSTGRES_PASSWORD}"
      POSTGRES_DB: request_db
    ports:
      - "5434:5432"
    volumes:
      - request_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ───────────────────────────── Audit Database ────────────────────────────
  audit_db:
    image: postgres:16-alpine
    container_name: audit_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-CHANGE_ME_POSTGRES_PASSWORD}"
      POSTGRES_DB: audit_db
    ports:
      - "5437:5432"
    volumes:
      - audit_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ───────────────────────── Notification Database ─────────────────────────
  notification_db:
    image: postgres:16-alpine
    container_name: notification_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-CHANGE_ME_POSTGRES_PASSWORD}"
      POSTGRES_DB: notification_db
    ports:
      - "5438:5432"
    volumes:
      - notification_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─────────────────────────────── RabbitMQ ────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-egov}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:-egov-rabbitmq-dev-secret}"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─────────────────────── Service Request Service ─────────────────────────
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  service_request_service:
    build:
      context: .
      dockerfile: src/ServiceRequestService/Dockerfile
    container_name: service_request_service
    ports:
      - "5003:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=request_db;Port=5432;Database=request_db;Username=postgres;Password=${POSTGRES_PASSWORD:-CHANGE_ME_POSTGRES_PASSWORD}"
      RequestDb__Host: "${RequestDb__Host:-request_db}"
      RequestDb__Port: "${RequestDb__Port:-5432}"
      RequestDb__Database: "${RequestDb__Database:-request_db}"
      RequestDb__Username: "${RequestDb__Username:-postgres}"
      RequestDb__Password: "${RequestDb__Password:-CHANGE_ME_POSTGRES_PASSWORD}"
      RequestDb__SslMode: "${RequestDb__SslMode:-Disable}"
      RabbitMQ__Host: "${RabbitMQ__Host:-rabbitmq}"
      RabbitMQ__Port: "${RabbitMQ__Port:-5672}"
      RabbitMQ__Username: "${RabbitMQ_USER:-egov}"
      RabbitMQ__Password: "${RABBITMQ_PASSWORD:-egov-rabbitmq-dev-secret}"
      Jwt__Key: "${JWT_SECRET_KEY:-CHANGE_ME_GENERATE_A_RANDOM_SECRET_MINIMUM_32_CHARS}"
      Jwt__Issuer: "AuthService"
      Jwt__Audience: "EGovernmentPlatform"
      DocumentService__BaseUrl: "http://document_service:8080/"
    depends_on:
      request_db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ─────────────────────────── Document Database ───────────────────────────
  document_db:
    image: postgres:16-alpine
    container_name: document_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-CHANGE_ME_POSTGRES_PASSWORD}"
      POSTGRES_DB: document_db
    ports:
      - "5435:5432"
    volumes:
      - document_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─────────────────────────── Document Service ────────────────────────────
  document_service:
    build:
      context: .
      dockerfile: src/DocumentService/Dockerfile
    container_name: document_service
    ports:
      - "5004:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=document_db;Port=5432;Database=document_db;Username=postgres;Password=${POSTGRES_PASSWORD:-CHANGE_ME_POSTGRES_PASSWORD}"
      DocumentDb__Host: "${DocumentDb__Host:-document_db}"
      DocumentDb__Port: "${DocumentDb__Port:-5432}"
      DocumentDb__Database: "${DocumentDb__Database:-document_db}"
      DocumentDb__Username: "${DocumentDb__Username:-postgres}"
      DocumentDb__Password: "${DocumentDb__Password:-CHANGE_ME_POSTGRES_PASSWORD}"
      DocumentDb__SslMode: "${DocumentDb__SslMode:-Disable}"
      RabbitMQ__Host: "${RabbitMQ__Host:-rabbitmq}"
      RabbitMQ__Port: "${RabbitMQ__Port:-5672}"
      RabbitMQ__Username: "${RabbitMQ_USER:-egov}"
      RabbitMQ__Password: "${RABBITMQ_PASSWORD:-egov-rabbitmq-dev-secret}"
      Jwt__Key: "${JWT_SECRET_KEY:-CHANGE_ME_GENERATE_A_RANDOM_SECRET_MINIMUM_32_CHARS}"
      Jwt__Issuer: "AuthService"
      Jwt__Audience: "EGovernmentPlatform"
    depends_on:
      document_db:
        condition: service_healthy

  # ══════════════════════════════ API Gateway ══════════════════════════════
  notification_service:
    build:
      context: .
      dockerfile: src/NotificationService/Dockerfile
    container_name: notification_service
    ports:
      - "5005:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=notification_db;Port=5432;Database=notification_db;Username=postgres;Password=${POSTGRES_PASSWORD:-CHANGE_ME_POSTGRES_PASSWORD}"
      NotificationDb__Host: "${NotificationDb__Host:-notification_db}"
      NotificationDb__Port: "${NotificationDb__Port:-5432}"
      NotificationDb__Database: "${NotificationDb__Database:-notification_db}"
      NotificationDb__Username: "${NotificationDb__Username:-postgres}"
      NotificationDb__Password: "${NotificationDb__Password:-CHANGE_ME_POSTGRES_PASSWORD}"
      NotificationDb__SslMode: "${NotificationDb__SslMode:-Disable}"
      RabbitMQ__Host: "${RabbitMQ__Host:-rabbitmq}"
      RabbitMQ__Port: "${RabbitMQ__Port:-5672}"
      RabbitMQ__Username: "${RABBITMQ_USER:-egov}"
      RabbitMQ__Password: "${RABBITMQ_PASSWORD:-egov-rabbitmq-dev-secret}"
      Jwt__Key: "${JWT_SECRET_KEY:-CHANGE_ME_GENERATE_A_RANDOM_SECRET_MINIMUM_32_CHARS}"
      Jwt__Issuer: "AuthService"
      Jwt__Audience: "EGovernmentPlatform"
      AuthService__BaseUrl: "http://auth_service:8080/"
      Internal__ApiKey: "${INTERNAL_API_KEY:-CHANGE_ME_INTERNAL_KEY}"
      Smtp__Host: "mailhog"
      Smtp__Port: "1025"
      Smtp__From: "noreply@egovernment.local"
      Smtp__FromName: "E-Government Platform"
      Smtp__UseStartTls: "false"
      Platform__BaseUrl: "${PLATFORM_BASE_URL:-http://localhost:3000}"
    depends_on:
      notification_db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth_service:
        condition: service_started
      mailhog:
        condition: service_started

  api_gateway:
    build:
      context: .
      dockerfile: src/ApiGateway/Dockerfile
    container_name: api_gateway
    ports:
      - "5050:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      AuthService__Url: "${AuthService__Url:-http://auth_service:8080}"
      CitizenService__Url: "${CitizenService__Url:-http://citizen_service:8080}"
      ServiceRequestService__Url: "${ServiceRequestService__Url:-http://service_request_service:8080}"
      DocumentService__Url: "${DocumentService__Url:-http://document_service:8080}"
      NotificationService__Url: "${NotificationService__Url:-http://notification_service:8080}"
      Cors__AllowedOrigins__0: "${Cors__AllowedOrigins__0:-http://localhost:3000}"
      Cors__AllowedOrigins__1: "${Cors__AllowedOrigins__1:-http://localhost:5173}"
    depends_on:
      - auth_service
      - citizen_service
      - service_request_service
      - document_service
      - notification_service

  # ══════════════════════════════ Frontend ═════════════════════════════════
  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      - api_gateway

volumes:
  auth_db_data:
  citizen_db_data:
  request_db_data:
  document_db_data:
  audit_db_data:
  notification_db_data:
  rabbitmq_data:
