services:
  - type: web
    name: auth-service
    env: docker
    dockerfilePath: src/AuthService/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # NeonDB connection — set these in the Render dashboard
      - key: AuthDb__Host
        sync: false
      - key: AuthDb__Port
        value: "5432"
      - key: AuthDb__Database
        sync: false
      - key: AuthDb__Username
        sync: false
      - key: AuthDb__Password
        sync: false
      - key: AuthDb__SslMode
        value: Require
      - key: Jwt__Key
        sync: false
      - key: Jwt__Issuer
        value: AuthService
      - key: Jwt__Audience
        value: EGovernmentPlatform
      - key: Admin__Email
        sync: false
      - key: Admin__Password
        sync: false
      - key: Admin__FullName
        value: System Administrator

  - type: web
    name: citizen-service
    env: docker
    dockerfilePath: src/CitizenService/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: CitizenDb__Host
        sync: false
      - key: CitizenDb__Port
        value: "5432"
      - key: CitizenDb__Database
        sync: false
      - key: CitizenDb__Username
        sync: false
      - key: CitizenDb__Password
        sync: false
      - key: CitizenDb__SslMode
        value: Require
      - key: Jwt__Key
        sync: false
      - key: Jwt__Issuer
        value: AuthService
      - key: Jwt__Audience
        value: EGovernmentPlatform

  - type: web
    name: service-request-service
    env: docker
    dockerfilePath: src/ServiceRequestService/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: RequestDb__Host
        sync: false
      - key: RequestDb__Port
        value: "5432"
      - key: RequestDb__Database
        sync: false
      - key: RequestDb__Username
        sync: false
      - key: RequestDb__Password
        sync: false
      - key: RequestDb__SslMode
        value: Require
      - key: Jwt__Key
        sync: false
      - key: Jwt__Issuer
        value: AuthService
      - key: Jwt__Audience
        value: EGovernmentPlatform

  - type: web
    name: document-service
    env: docker
    dockerfilePath: src/DocumentService/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DocumentDb__Host
        sync: false
      - key: DocumentDb__Port
        value: "5432"
      - key: DocumentDb__Database
        sync: false
      - key: DocumentDb__Username
        sync: false
      - key: DocumentDb__Password
        sync: false
      - key: DocumentDb__SslMode
        value: Require
      - key: Jwt__Key
        sync: false
      - key: Jwt__Issuer
        value: AuthService
      - key: Jwt__Audience
        value: EGovernmentPlatform

  - type: web
    name: api-gateway
    env: docker
    dockerfilePath: src/ApiGateway/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: AuthService__Url
        value: http://auth-service:10000
      - key: CitizenService__Url
        value: http://citizen-service:10000
      - key: ServiceRequestService__Url
        value: http://service-request-service:10000
      - key: DocumentService__Url
        value: http://document-service:10000
      - key: Cors__AllowedOrigins__0
        sync: false

  - type: web
    name: frontend
    env: docker
    dockerfilePath: src/frontend/Dockerfile
    dockerContext: src/frontend
    envVars:
      - key: VITE_API_URL
        sync: false

# All databases are now managed on NeonDB
