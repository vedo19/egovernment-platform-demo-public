name: Api Gateway CI

on:
  push:
    branches: [main]
    paths:
      - 'src/ApiGateway/**'
      - '.github/workflows/api-gateway-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/ApiGateway/**'
      - '.github/workflows/api-gateway-ci.yml'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/api-gateway

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: src/ApiGateway/ApiGateway.csproj

      - name: Restore dependencies
        run: dotnet restore src/ApiGateway/ApiGateway.csproj

      - name: Build
        run: dotnet build src/ApiGateway/ApiGateway.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test src/ApiGateway/ApiGateway.csproj --configuration Release --no-build --logger "console;method=trx" --results-directory ./TestResults

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-gateway-test-results
          path: TestResults/*.trx
          retention-days: 30

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: API Gateway Tests
          path: TestResults/*.trx
          reporter: dotnet-trx

      - name: Generate coverage report
        run: dotnet test src/ApiGateway/ApiGateway.csproj --configuration Release --no-build --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura
        continue-on-error: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-gateway-coverage
          path: '**/coverage.cobertura.xml'
          retention-days: 30

  docker-build-and-push:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./src/ApiGateway
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
